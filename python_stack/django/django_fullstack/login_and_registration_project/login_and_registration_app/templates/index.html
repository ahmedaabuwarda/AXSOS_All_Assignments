<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Login and Registration</title>
  </head>
  <body>
    <main class="container py-5">
      <h1 class="mb-4">Login and Registration</h1>

      {% if messages %}
        {% for message in messages %}
        <div class="alert alert-info" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <div class="row g-4">
        <section class="col-md-6">
          <h2 class="h4 mb-3">Register</h2>
          <form action="/register" method="post" class="border rounded p-4">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label" for="first_name">First Name</label>
              <input
                class="form-control"
                type="text"
                id="first_name"
                name="first_name"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="last_name">Last Name</label>
              <input
                class="form-control"
                type="text"
                id="last_name"
                name="last_name"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="register_email">Email</label>
              <input
                class="form-control"
                type="email"
                id="register_email"
                name="email"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="register_password">Password</label>
              <input
                class="form-control"
                type="password"
                id="register_password"
                name="password"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="confirm_password">
                Confirm Password
              </label>
              <input
                class="form-control"
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
              />
            </div>
            <button class="btn btn-primary" type="submit">Register</button>
          </form>
        </section>

        <section class="col-md-6">
          <h2 class="h4 mb-3">Login</h2>
          <form action="/login" method="post" class="border rounded p-4">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label" for="login_email">Email</label>
              <input
                class="form-control"
                type="email"
                id="login_email"
                name="email"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="login_password">Password</label>
              <input
                class="form-control"
                type="password"
                id="login_password"
                name="password"
                required
              />
            </div>
            <button class="btn btn-success" type="submit">Login</button>
          </form>
        </section>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
