<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/index.css'%}" />
    <title>Show The Show</title>
  </head>
  <body>
    <div class="container">
      <h1>TV Show</h1>
      <p>Last Updated: {{show.updated_at}}</p>
      <form>
        <div class="div1">
          <label for="title">Title</label>
          <input
            type="text"
            id="title"
            required
            value="{{show.title}}"
            disabled
          />
        </div>
        <div class="div2">
          <div class="div3">
            <label for="network">Network</label>
            <input type="text" id="network" value="{{show.network}}" disabled />
          </div>
          <div class="div3">
            <label for="release_date">Relesed Date</label>
            <input
              type="text"
              id="release_date"
              value="{{show.release_date}}"
              disabled
            />
          </div>
        </div>
        <div class="div1">
          <label for="desc">Description</label>
          <textarea id="desc" rows="5" disabled>{{show.desc}}</textarea>
        </div>
        <div>
          <a class="btn black" href="{% url 'shows.root' %}">Back</a>
          <button class="btn" disabled>Create</button>
        </div>
      </form>
    </div>
  </body>
</html>
