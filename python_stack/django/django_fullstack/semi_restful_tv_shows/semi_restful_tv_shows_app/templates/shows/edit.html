<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/index.css'%}" />
    <title>Edit Show</title>
  </head>
  <body>
    <div class="container">
      <h1>Edit Show</h1>
      {% if messages %} {% for message in messages %}
      <p class="errors">{{message}}</p>
      {% endfor %} {% endif %}
      <form action="{% url 'shows.update' %}" , method="POST">
        {% csrf_token %}
        <input type="hidden" name="show_id" value="{{ show.id }}" />
        <div class="div1">
          <label for="title">Title</label>
          <input type="text" name="title" id="title" value="{{show.title}}" />
        </div>
        <div class="div2">
          <div class="div3">
            <label for="network">Network</label>
            <input
              type="text"
              name="network"
              id="network"
              value="{{show.network}}"
            />
          </div>
          <div class="div3">
            <label for="release_date">Release Date</label>
            <input
              type="date"
              name="release_date"
              id="release_date"
              value="{{ show.release_date|date:'Y-m-d' }}"
            />
          </div>
        </div>
        <div class="div1">
          <label for="desc">Description</label>
          <textarea name="desc" id="desc" rows="5">{{show.desc}}</textarea>
        </div>
        <div>
          <a class="btn black" href="{% url 'shows.root' %}">Back</a>
          <button type="submit" class="btn">Update</button>
        </div>
      </form>
    </div>
  </body>
</html>
