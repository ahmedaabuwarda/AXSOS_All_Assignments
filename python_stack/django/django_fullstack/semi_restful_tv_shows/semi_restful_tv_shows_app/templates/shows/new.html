<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/index.css'%}" />
    <title>Create New Show</title>
  </head>
  <body>
    <div class="container">
      <h1>Add New Show</h1>
      <form action="{% url 'shows.store'%}" , method="POST">
        {% csrf_token %}
        <div class="div1">
          <label for="title">Title</label>
          <input type="text" name="title" id="title" required />
        </div>
        <div class="div2">
          <div class="div3">
            <label for="network">Network</label>
            <input type="text" name="network" id="network" required />
          </div>
          <div class="div3">
            <label for="release_date">Relesed Date</label>
            <input type="date" name="release_date" id="release_date" required />
          </div>
        </div>
        <div class="div1">
          <label for="desc">Description</label>
          <textarea name="desc" id="desc" rows="5"></textarea>
        </div>
        <div>
          <a class="btn black" href="{% url 'shows.root' %}">Back</a>
          <button type="submit" class="btn">Create</button>
        </div>
      </form>
    </div>
  </body>
</html>
