<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/index.css' %}" />
    <title>Dojos & Ninjas</title>
  </head>
  <body>
    <div class="container">
      <div class="form-div">
        <form action="/dojo" method="POST">
          <h2>Add a Dojo</h2>
          {% csrf_token %} Name:
          <input type="text" name="name" id="name" required /> City:
          <input type="text" name="city" id="city" required /> State:
          <input type="state" name="state" id="state" required />
          <button type="submit" class="btn">Add</button>
        </form>

        <form action="/ninja" method="POST">
          <h2>Add a Ninja</h2>
          {% csrf_token %} First Name:
          <input type="first_name" name="first_name" id="first_name" required />
          Last Name:
          <input type="last_name" name="last_name" id="last_name" required />
          Dojo:
          <select name="dojo_id" id="dojo_id" required>
            {% for dojo in dojos %}
            <option value="{{ dojo.id }}">{{ dojo.name }}</option>
            {% endfor %}
          </select>
          <button type="submit" class="btn">Add</button>
        </form>
      </div>

      <div class="dojos-div">
        <h2>All the Dojos</h2>
        <table>
          <thead></thead>
          <tbody>
            {% for dojo in dojos %}
            <tr>
              <td>{{ dojo.name }}</td>
              <td>
                <form action="/delete_dojo" method="POST">
                  {%csrf_token%}
                  <input type="hidden" name="dojo_id" value="{{dojo.id}}" />
                  <button type="submit" class="btn">Delete Dojo</button>
                </form>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
