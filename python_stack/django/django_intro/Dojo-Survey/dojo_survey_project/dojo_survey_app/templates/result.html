<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link
      rel="stylesheet"
      type="text/css"
      href="{% static 'css/result.css' %}"
    />
    <title>Dojo Survey Result</title>
  </head>
  <body>
    <div class="container">
      <h1>Submitted Information</h1>
      <div>
        <p>Name:</p>
        <p>{{ request.session.name }}</p>
      </div>
      <div>
        <p>Location:</p>
        <p>{{ location }}</p>
      </div>
      <div>
        <p>Favorite Language:</p>
        <p>{{ language }}</p>
      </div>
      <div>
        <p>Comment:</p>
        <p>{{ comment }}</p>
      </div>
    </div>
  </body>
</html>
