<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link
      rel="stylesheet"
      type="text/css"
      href="{% static 'css/index.css' %}"
    />
    <title>Counter</title>
  </head>
  <body>
    <div class="container">
      <h1>Counter</h1>
      <p>The count is: {{ count }}</p>
      <form action="{% url 'increment' %}" method="post">
        {% csrf_token %}
        <input
          type="text"
          id="countInput"
          name="count"
          placeholder="Enter a number"
        />
        <button type="submit">Increment Counter</button>
      </form>
      <button onclick="window.location.href = '{% url 'incrementByTwo' %}'">
        Increment by Two
      </button>
      <button onclick="window.location.href = '{% url 'destroy_session' %}'">
        Reset Counter
      </button>
    </div>
  </body>
</html>
