<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/show.css'%}" />
    <!-- <link rel="stylesheet" href="{% static 'css/index.css'%}" /> -->
    <title>Author {{author.first_name}}</title>
  </head>
  <body>
    <div class="container">
      <a class="btn" href="/">Back</a>
      <h1>ID: {{author.id}}</h1>
      <h1>Name: {{author.first_name}} {{author.last_name}}</h1>
      <h2>Books</h2>
      <ul>
        {% for book in author_books %}
        <li>{{book.title}}</li>
        {% endfor %}
      </ul>
      <form action="/add_book_to_author" method="post">
        {% csrf_token %}
        <input
          type="hidden"
          name="author_id"
          id="author_id"
          value="{{author.id}}"
        />
        <select name="book_id" id="book" required>
          {% for book in books%}
          <option value="{{book.id}}">{{book.title}}</option>
          {% endfor %}
        </select>
        <button type="submit" class="btn">Add</button>
      </form>
    </div>
  </body>
</html>
